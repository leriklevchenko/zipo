spring:
  datasource:
    url: ${PG_URL}
    username: ${PG_USER}
    password: ${PG_PASS}
  jpa:
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: always
jwt:
  secret: ${JWT_SECRET}

eds:
  keystore:
    base64: ${EDS_KEYSTORE_BASE64:}
    location: ${EDS_KEYSTORE_LOCATION:}
    password: ${EDS_KEYSTORE_PASSWORD}
    key-password: ${EDS_KEY_PASSWORD:${EDS_KEYSTORE_PASSWORD}}
    alias: ${EDS_KEY_ALIAS:license-signing}
  signature-algorithm: ${EDS_SIGNATURE_ALGORITHM:SHA256withRSA}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT:http://localhost:9000}}
  access-key: ${MINIO_ACCESS_KEY:ziovpo-app}
  secret-key: ${MINIO_SECRET_KEY:ziovpo-app-secret-12345}
  bucket: ${MINIO_BUCKET:ziovpo-signature-files}
  presigned-url-expiration-seconds: ${MINIO_PRESIGNED_URL_EXPIRATION_SECONDS:3600}

server:
  port: 8080
  ssl:
    enabled: true
    key-store: classpath:ssl/hotel-1bib23427.p12
    key-store-type: PKCS12
    key-store-password: ${TLS_KEYSTORE_PASSWORD}
    key-alias: hotel-1bib23427
